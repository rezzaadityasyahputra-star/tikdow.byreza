<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIKDOW // CYBER_DOWNLOADER</title>
    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0c;
            --neon-green: #00ff66;
            --neon-pink: #ff0055;
            --neon-cyan: #00f0ff;
            --dark-card: #121217;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Scanline effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99999;
            opacity: 0.8;
            pointer-events: none;
            background-size: 100% 2px, 3px 100%;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Logo Animation Floating & Glitch */
        .logo-container {
            margin-bottom: 30px;
            animation: float 4s ease-in-out infinite;
            text-align: center;
            position: relative;
        }

        .tiktok-logo {
            font-size: 5rem;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            position: relative;
            display: inline-block;
            text-shadow: 
                -3px -3px 0 var(--neon-cyan),  
                 3px  3px 0 var(--neon-pink);
            animation: glitch 3s infinite;
        }

        .logo-sub {
            color: var(--neon-green);
            letter-spacing: 5px;
            font-size: 1rem;
            margin-top: 5px;
            text-shadow: 0 0 5px var(--neon-green);
        }

        /* Main Card */
        .search-box {
            background: var(--dark-card);
            border: 2px solid var(--neon-green);
            padding: 30px;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            position: relative;
            margin-bottom: 30px;
        }

        .search-box::after {
            content: "SYS_STATUS: READY";
            position: absolute;
            bottom: -20px;
            right: 10px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
        }

        .input-group {
            display: flex;
            gap: 15px;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            color: var(--neon-cyan);
            font-size: 1.1rem;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px var(--neon-cyan);
            border-color: #fff;
        }

        /* Cyber Button */
        button {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Loader */
        .loader {
            display: none;
            margin: 20px 0;
            color: var(--neon-pink);
            font-size: 1.2rem;
            letter-spacing: 3px;
        }

        .loader span {
            animation: blink 1s infinite;
        }

        /* Result Section */
        .result-card {
            display: none;
            background: var(--dark-card);
            border: 2px solid var(--neon-pink);
            padding: 30px;
            width: 100%;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            animation: fadeIn 0.5s ease;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px dashed rgba(255, 0, 85, 0.3);
            padding-bottom: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            object-fit: cover;
        }

        .user-info h3 {
            color: #fff;
            font-family: 'Orbitron', sans-serif;
        }

        .user-info p {
            color: var(--neon-cyan);
        }

        .video-desc {
            margin-bottom: 20px;
            color: #ccc;
            font-style: italic;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.9rem;
        }

        .stat-box {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border: 1px solid rgba(240, 240, 240, 0.1);
        }

        .stat-box i {
            color: var(--neon-pink);
            margin-right: 5px;
        }

        .download-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-dl {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            text-align: center;
            text-decoration: none;
            display: block;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .btn-dl:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .btn-music {
            grid-column: span 2;
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .btn-music:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glitch {
            0%, 100% { text-shadow: -3px -3px 0 var(--neon-cyan), 3px 3px 0 var(--neon-pink); }
            20% { text-shadow: 4px -2px 0 var(--neon-cyan), -3px 3px 0 var(--neon-pink); }
            40% { text-shadow: -2px 3px 0 var(--neon-cyan), 2px -3px 0 var(--neon-pink); }
            60% { text-shadow: 3px 2px 0 var(--neon-cyan), -4px -2px 0 var(--neon-pink); }
            80% { text-shadow: -1px -3px 0 var(--neon-cyan), 3px 2px 0 var(--neon-pink); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .input-group { flex-direction: column; }
            .download-buttons { grid-template-columns: 1fr; }
            .btn-music { grid-column: span 1; }
            .tiktok-logo { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo TikTok Bergerak (Float/Glitch) Tengah Atas -->
        <div class="logo-container">
            <div class="tiktok-logo"><i class="fab fa-tiktok"></i> TIKDOW</div>
            <div class="logo-sub">UNDUH VIDEO NO WATERMARK</div>
        </div>

        <!-- Input Box -->
        <div class="search-box">
            <div class="input-group">
                <input type="text" id="targetUrl" placeholder="MASUKKAN URL TIKTOK..." autocomplete="off">
                <button id="btnFetch" onclick="fetchVideo()"><i class="fas fa-terminal"></i> INJECT</button>
            </div>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader">
            >> SEDANG MENGHUBUNGI API... <span>...</span>
        </div>

        <!-- Result Card UI Hacker -->
        <div class="result-card" id="resultCard">
            <div class="profile-section">
                <img src="" class="avatar" id="authorAvatar" alt="Avatar">
                <div class="user-info">
                    <h3 id="authorName">@username</h3>
                    <p id="authorNick">Nickname</p>
                </div>
            </div>

            <p class="video-desc" id="videoDesc">Caption video di sini...</p>

            <div class="stats">
                <div class="stat-box"><i class="fas fa-heart"></i> <span id="likeCount">0</span></div>
                <div class="stat-box"><i class="fas fa-comment"></i> <span id="commentCount">0</span></div>
                <div class="stat-box"><i class="fas fa-play"></i> <span id="playCount">0</span></div>
            </div>

            <div class="download-buttons">
                <a href="#" target="_blank" class="btn-dl" id="dlNoWatermark"><i class="fas fa-download"></i> WM_REMOVED.MP4</a>
                <a href="#" target="_blank" class="btn-dl" id="dlHd"><i class="fas fa-shield-halved"></i> ULTRA_HD.MP4</a>
                <a href="#" target="_blank" class="btn-dl btn-music" id="dlMusic"><i class="fas fa-music"></i> EXTRACT_AUDIO.MP3</a>
            </div>
        </div>
    </div>

    <script>
        async function fetchVideo() {
            const urlInput = document.getElementById('targetUrl').value;
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            const btnFetch = document.getElementById('btnFetch');

            if (!urlInput) {
                alert('Sistem Error: Masukkan URL TikTok terlebih dahulu!');
                return;
            }

            // UI Response Animasi Tombol saat loading
            btnFetch.innerHTML = `<i class="fas fa-spinner fa-spin"></i> RUNNING`;
            btnFetch.style.borderColor = 'var(--neon-pink)';
            btnFetch.style.color = 'var(--neon-pink)';
            loader.style.display = 'block';
            resultCard.style.display = 'none';

            const apiUrl = `https://api.fazzcode.qzz.io/api/download/tiktokv2?url=${encodeURIComponent(urlInput)}`;

            try {
                // Mengambil data dari API
                const response = await fetch(apiUrl);
                const result = await response.json();

                if (result.status && result.data) {
                    const data = result.data;

                    // Mengisi Data ke UI Cyberpunk
                    document.getElementById('authorAvatar').src = data.author_cover_link || data.cover_link;
                    document.getElementById('authorName').innerText = `@${data.author_unique_id}`;
                    document.getElementById('authorNick').innerText = data.author_nickname;
                    document.getElementById('videoDesc').innerText = data.text || 'No Caption Provided.';
                    
                    // Stats
                    document.getElementById('likeCount').innerText = data.like_count;
                    document.getElementById('commentCount').innerText = data.comment_count;
                    document.getElementById('playCount').innerText = data.play_count;

                    // Link Download (Menuju ke proxy/direct server tikcdn dari respons)
                    document.getElementById('dlNoWatermark').href = data.no_watermark_link;
                    document.getElementById('dlHd').href = data.no_watermark_link_hd || data.no_watermark_link;
                    document.getElementById('dlMusic').href = data.music_link;

                    // Memunculkan hasil dengan animasi CSS
                    resultCard.style.display = 'block';
                } else {
                    alert('Gagal mengekstrak payload data. Pastikan URL valid.');
                }
            } catch (error) {
                console.error(error);
                alert('Koneksi terputus ke core API server.');
            } finally {
                // Reset Animasi Tombol
                loader.style.display = 'none';
                btnFetch.innerHTML = `<i class="fas fa-terminal"></i> INJECT`;
                btnFetch.style.borderColor = 'var(--neon-green)';
                btnFetch.style.color = 'var(--neon-green)';
            }
        }
    </script>
</body>
</html>
